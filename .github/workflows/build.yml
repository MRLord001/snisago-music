name: Build Snisago Music (Windows)

on:
  release:
    types: [published] # <--- Запускается только при публикации релиза на GitHub
  workflow_dispatch: # Оставляем возможность запустить сборку вручную кнопкой

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Скачивание исходного кода
        uses: actions/checkout@v4

      - name: Установка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Установка зависимостей (npm install)
        run: npm install

      - name: Компиляция и публикация релиза на GitHub
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Сохранение готового установщика и latest.yml в артефакты
        uses: actions/upload-artifact@v4
        with:
          name: Snisago-Music-Installer
          path: |
            dist/*.exe
            dist/latest.yml

      - name: Уведомление в Discord
        if: success()
        shell: bash
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          RELEASE_BODY: ${{ github.event.release.body }} 
          RELEASE_NAME: ${{ github.event.release.name }}
        run: |
          node -e "
          const fs = require('fs');
          const version = require('./package.json').version;
          const body = process.env.RELEASE_BODY || 'Описание обновления не указано.';
          const releaseName = process.env.RELEASE_NAME || 'Обновление';
          
          const payload = {
            content: '🎉 ||@here|| Доступна новая версия!',
            embeds: [{
              title: '🚀 Snisago Music обновлен до версии ' + version + ' (' + releaseName + ')',
              description: '**Список изменений:**\n' + body + '\n\n*Вы можете обновить плеер самостоятельно в настройках приложения. Автоматическая проверка и загрузка обновлений происходит при каждом запуске плеера.*',
              color: 9133238,
              footer: {
                text: 'Snisago Music Update System'
              }
            }]
          };
          fs.writeFileSync('payload.json', JSON.stringify(payload));
          "
          
          # Отправляем этот файл в Discord
          curl -H "Content-Type: application/json" -X POST -d @payload.json $DISCORD_WEBHOOK
          
