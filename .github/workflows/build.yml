name: Build Snisago Music (Windows)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Позволяет запустить сборку вручную по кнопке

# ДАЕМ РАЗРЕШЕНИЕ РОБОТУ СОЗДАВАТЬ РЕЛИЗЫ
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest # Запускаем виртуальную машину на Windows

    steps:
      - name: Скачивание исходного кода
        uses: actions/checkout@v4

      - name: Установка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22' # Версия Node.js для сборки

      - name: Установка зависимостей (npm install)
        run: npm install

      - name: Компиляция и публикация релиза на GitHub
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # ЭТОТ ТОКЕН РЕШИТ ОШИБКУ!

      - name: Сохранение готового установщика и latest.yml в артефакты
        uses: actions/upload-artifact@v4
        with:
          name: Snisago-Music-Installer
          path: |
            dist/*.exe
            dist/latest.yml
