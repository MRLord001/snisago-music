name: Build Snisago Music (Windows)

on:
  release:
    types: [published] # <--- Запускается только при публикации релиза на GitHub
  workflow_dispatch: # Оставляем возможность запустить сборку вручную кнопкой

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Скачивание исходного кода
        uses: actions/checkout@v4

      - name: Установка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Установка зависимостей (npm install)
        run: npm install

      - name: Компиляция и публикация релиза на GitHub
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Сохранение готового установщика и latest.yml в артефакты
        uses: actions/upload-artifact@v4
        with:
          name: Snisago-Music-Installer
          path: |
            dist/*.exe
            dist/latest.yml

      - name: Уведомление в Discord
        if: success()
        shell: bash
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          APP_VERSION=$(node -p "require('./package.json').version")
          
          # Аккуратно записываем наш текст в файл payload.json (это спасет кириллицу)
          cat <<EOF > payload.json
          {
            "content": "🎉 ||@here|| Вышло новое обновление (HOTFIX)!",
            "embeds": [{
              "title": "🚀 Snisago Music обновлен до версии $APP_VERSION",
              "description": "Сборка завершена! Установочный файл успешно прикреплен в разделе Releases. Плеер сам скачает обновление в фоне (или скачайте вручную, если старая версия не открывается).",
              "color": 9133238,
              "footer": {
                "text": "Snisago Music Update System"
              }
            }]
          }
          EOF
          
          # Отправляем этот файл в Discord
          curl -H "Content-Type: application/json" -X POST -d @payload.json $DISCORD_WEBHOOK
